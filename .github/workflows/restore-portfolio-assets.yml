name: Restore portfolio media from prior production

on:
  push:
    branches:
      - asset-recovery-2026-11-23
    paths:
      - .github/workflows/restore-portfolio-assets.yml

permissions:
  contents: write

jobs:
  restore-media:
    if: github.repository == 'nguyenand18/andrew-nguyen-portfolio'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out restoration branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Recover and verify original portfolio assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://andrew-nguyen-portfolio-vercel-1.vercel.app"
          count=0
          while read -r digest file; do
            if [[ -z "$digest" ]]; then continue; fi
            if [[ ! "$digest" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$file" =~ ^assets/[A-Za-z0-9._/-]+$ ]]; then
              echo "Unsafe asset manifest entry"; exit 1
            fi
            mkdir -p "$(dirname "$file")"
            curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 90 --output "$file" "$base/$file"
            actual="$(sha1sum "$file" | awk '{print $1}')"
            if [[ "$actual" != "$digest" ]]; then
              echo "Checksum mismatch: $file"; exit 1
            fi
            count=$((count+1))
          done < assets/asset-sha1-manifest.txt
          if [[ "$count" -ne 25 ]]; then echo "Missing assets"; exit 1; fi
          echo "Verified $count portfolio media files"
      - name: Commit verified media to the restoration branch
        shell: bash
        run: |
          set -euo pipefail
          git add assets/
          if git diff --cached --quiet; then
            echo "No media changes to commit"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Restore original portfolio portrait, resume and video assets"
          git push origin HEAD:"$GITHUB_REF_NAME"
